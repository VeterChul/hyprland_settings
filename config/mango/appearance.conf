# ==========================================
# Внешний вид
# ==========================================

# ----- Отступы и рамки -----
gappih=2
gappiv=2
gappoh=5
gappov=5
borderpx=2
border_radius=10
no_radius_when_single=0

# ----- Цвета (формат RRGGBBAA) -----
rootcolor=0x000000ff
bordercolor=0x4B00BBff
focuscolor=0xFF00FFFF
dropcolor=0x8FBA7C55
splitcolor=0xEB441Eff
maximizescreencolor=0xBABD2Cff
urgentcolor=0xad401fff
scratchpadcolor=0xc4939dff
globalcolor=0x8d64cfff
overlaycolor=0x95C381ff

# ----- Прозрачность -----
focused_opacity=1.0
unfocused_opacity=1.0

# ----- Размытие -----
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes=1
blur_params_radius=3
blur_params_noise=0.0
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.2

# ----- Тени -----
shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=4
shadows_blur=4
shadows_position_x=0
shadows_position_y=0
shadowscolor=0x1a1a1aee