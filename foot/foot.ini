[main]
font=Comic Mono:size=8
bold-text-in-bright=yes
underline-offset=0
dpi-aware=yes
pad=10x10

[scrollback]
lines=10000
multiplier=5.0

[colors]
foreground=ff00ff
background=0a0a0a

selection-foreground=ffffff
selection-background=aa00aa

cursor=00ffaa 0a0a0a  # цвет курсора и цвет текста под курсором

# Normal colors
regular0=1a1a1a   # черный (фоновый)
regular1=ff00ff   # красный - более контрастный
regular2=00ffaa   # зеленый - ваш любимый цвет
regular3=f1fa8c   # желтый - хорошая читаемость
regular4=bd93f9   # синий - фиолетовый оттенок
regular5=ff79c6   # пурпурный - розово-фиолетовый
regular6=8be9fd   # голубой - контрастный
regular7=f8f8f2   # белый - основной текст

# Bright colors
bright0=4a4a4a    # яркий черный (серый)
bright1=ff92d0    # яркий красный
bright2=33ffbb    # яркий зеленый - производный от 00ffaa
bright3=ffffa5    # яркий желтый
bright4=d6acff    # яркий синий - светлый фиолетовый
bright5=ffa3e6    # яркий пурпурный
bright6=a4ffff    # яркий голубой
bright7=ffffff    # яркий белый

[cursor]
style=block
blink=yes

[mouse]
hide-when-typing=yes

[bell]
urgent=no
notify=no

[tweak]
font-monospace-warn=no

[key-bindings]
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
scrollback-up-line=Ctrl+Shift+k
scrollback-down-line=Ctrl+Shift+j
clipboard-copy=Ctrl+Shift+c
clipboard-paste=Ctrl+Shift+v
