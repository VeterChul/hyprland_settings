# ~/.config/hyprlock/hyprlock.conf
general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = true
}

background {
    monitor =
    path = /home/veter/Pic/Обои/acitaka+can1.jpg
    blur_passes = 0
    blur_size = 0
    noise = 0.01
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.0
}

label {
    monitor =
    text = cmd[update:1000] echo -e "Привет $USER"
    color = rgba(251,253,240, 1)
    font_size = 75            
    font_family = Bardi
    position = 0, 450
    halign = center
    valign = center

}

label {
    monitor =
    text = cmd[update:1000] echo -e "$TIME"
    color = rgba(251,253,240, 1)
    font_size = 250            
    font_family = Bardi
    position = 0, 275
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50           
    outline_thickness = 3    
    dots_size = 0.3          
    dots_spacing = 0.3      
    dots_center = true
    outer_color = rgba(251,253,240, 1)
    inner_color = rgb(0, 0, 0)
    font_color = rgba(251,253,240, 1)
    check_color = rgba(63, 63, 63, 1)
    fail_color = rgba(80, 0, 80, 1)
    font_family = Bardi
    fade_on_empty = false
    placeholder_text = Пароль...
    fail_text = <i>Пароль неверный</i>
    fade_timeout = 500
    hide_input = false
    position = 0, 120
    halign = center
    valign = center
}


label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(251,253,240, 1)
    font_size = 44         
    font_family = Bardi
    position = 0, 50
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(python3 ~/.config/waybar/modules/weather/weather_read_lock.py)"
    color = rgba(251,253,240, 1)
    font_size = 40          
    font_family = Bardi
    position = 0, -10
    halign = center
    valign = center

}

