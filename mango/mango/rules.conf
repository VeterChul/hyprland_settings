# ==========================================
# Правила для окон и слоёв
# ==========================================

# ----- Прозрачность для приложений -----
windowrule=opacity 0.95,appid:codium
windowrule=opacity 0.95,appid:obsidian

# ----- Плавающие диалоги открытия/сохранения -----
windowrule=float,appid:zen-browser,title:.*(Open|Save).*
windowrule=float,appid:firefox,title:.*(Open|Save).*
windowrule=float,appid:Thunar,title:.*(Open|Save).*

# ----- (Опционально) Можно добавить другие правила -----
# Например, запретить размытие для некоторых окон
# layerrule=noblur:1,layer_name:rofi